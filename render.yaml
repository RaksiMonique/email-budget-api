# Render Blueprint — apply via dashboard: New + → Blueprint → select this repo.
# Infra-as-code for PLAN.md Phase 9. Secret values (sync: false) are entered
# once in the Render dashboard, never committed.

services:
  - type: web
    name: email-budget-api
    runtime: docker
    rootDir: backend
    # FREE for pre-launch testing (decided 2026-08-08). Accepted trade-offs:
    # spin-down after ~15 min idle (first email after a quiet spell takes
    # ~1 min — queue retries absorb it), and no preDeployCommand on free —
    # migrations run at container boot via RUN_MIGRATIONS instead.
    # Upgrade to starter before real users / the <10s target matters.
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: RUN_MIGRATIONS
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: email-budget-db
          property: connectionString
      - key: INTERNAL_SECRET
        sync: false
      - key: SECRET_ENCRYPTION_KEY
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: email-budget-raw
      - key: SENTRY_DSN
        sync: false

databases:
  - name: email-budget-db
    # FREE tier: 1 GB, EXPIRES 30 DAYS after creation (14-day grace, then
    # deleted!). Fine for the testing window — upgrade or dump/restore before
    # the deadline. Note the creation date when you apply this.
    plan: free
    postgresMajorVersion: "16"
