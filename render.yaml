# Render Blueprint — apply via dashboard: New + → Blueprint → select this repo.
# Infra-as-code for PLAN.md Phase 9. Secret values (sync: false) are entered
# once in the Render dashboard, never committed.

services:
  - type: web
    name: email-budget-api
    runtime: docker
    rootDir: backend
    # FREE for pre-launch testing (decided 2026-08-08). Accepted trade-offs:
    # spin-down after ~15 min idle (first email after a quiet spell takes
    # ~1 min — queue retries absorb it), and no preDeployCommand on free —
    # migrations run at container boot via RUN_MIGRATIONS instead.
    # Upgrade to starter before real users / the <10s target matters.
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: RUN_MIGRATIONS
        value: "true"
      # external managed Postgres (Neon/Supabase free tier) — paste in dashboard.
      # Render's own free Postgres expires 30 days after creation, so we use an
      # external provider instead. Use the DIRECT/session connection string.
      - key: DATABASE_URL
        sync: false
      - key: INTERNAL_SECRET
        sync: false
      - key: SECRET_ENCRYPTION_KEY
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: email-budget-raw
      - key: SENTRY_DSN
        sync: false

# No `databases:` block — Postgres is an external managed provider
# (Neon / Supabase), set via the DATABASE_URL secret above.
