name = "email-queue-consumer"
main = "src/index.ts"
compatibility_date = "2026-07-01"
workers_dev = false # triggered by queue consumption, not HTTP — no public URL

# Wired to production 2026-08-08: FastAPI live at the URL below; INTERNAL_SECRET
# set via `wrangler secret put`. Deploying registers this as a consumer of the
# email-processing queue.

[[queues.consumers]]
queue = "email-processing"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "email-processing-dlq"

[vars]
FASTAPI_INTERNAL_URL = "https://email-budget-api.onrender.com"
# INTERNAL_SECRET — set via: wrangler secret put INTERNAL_SECRET
