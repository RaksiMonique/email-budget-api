[project]
name = "email-budget-api"
version = "0.1.0"
description = "Extract transactions from auto-forwarded financial emails"
requires-python = ">=3.11"
dependencies = [
    # extraction (Phase 1) — stdlib-first; these improve accuracy:
    "html2text>=2024.2.26",
    "dateparser>=1.2.0",
    # service (Phase 3+):
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "boto3>=1.34",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
sentry = ["sentry-sdk>=2.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
